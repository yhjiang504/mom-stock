<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花花的台股盤後小幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="bg-white border-2 border-slate-200 p-6 rounded-3xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-blue-900 flex items-center gap-2">
                    📈 花花的台股盤後小幫手
                </h1>
                <p class="text-slate-500 text-lg mt-1">即時行情、三大法人籌碼與財報輕鬆看</p>
            </div>
            <div id="update-time-badge" class="bg-blue-50 text-blue-800 px-4 py-2 rounded-2xl font-bold border border-blue-200 text-base">
                🕒 最後資料更新時間：載入中...
            </div>
        </header>

        <div id="main-tabs" class="grid grid-cols-2 gap-4">
            <button id="btn-fav" onclick="switchTab('favorite')" class="bg-blue-600 text-white text-xl md:text-2xl font-bold py-4 px-4 rounded-2xl shadow-lg transition">
                ⭐ 我的最愛
            </button>
            <button id="btn-sec" onclick="switchTab('sectors')" class="bg-slate-200 text-slate-700 text-xl md:text-2xl font-bold py-4 px-4 rounded-2xl shadow-lg transition">
                📁 上市類股總覽
            </button>
        </div>

        <div id="nav-back" class="hidden">
            <button onclick="goBack()" class="bg-slate-700 hover:bg-slate-800 text-white text-xl font-bold py-3 px-6 rounded-2xl shadow transition flex items-center gap-2">
                ⬅️ 返回上一頁
            </button>
        </div>

        <main id="app-content" class="bg-white border-2 border-slate-200 p-6 rounded-3xl shadow-md min-h-[400px]">
        </main>

    </div>

    <script>
        let marketMetadata = { lastUpdate: "載入中..." };
        let stockDatabase = {};

        let favorites = JSON.parse(localStorage.getItem('mom_stock_fav')) || ["2330", "2881"];
        let currentView = "favorite";
        let selectedCategory = "";

        async function initApp() {
            try {
                const response = await fetch('stock_data.json?' + new Date().getTime());
                if (!response.ok) throw new Error("找不到資料檔案");
                const jsonData = await response.json();
                
                marketMetadata = jsonData.metadata;
                stockDatabase = jsonData.database;
            } catch (error) {
                console.log("載入預設資料...", error);
                marketMetadata = { lastUpdate: "展示模式" };
                stockDatabase = {
                    "半導體業": [
                        { code: "2330", name: "台積電", price: 1050, change: 25, changePct: 2.41, volume: "45,210", weekChangePct: 5.2, pe: 22.5, yieldPct: 1.52, eps: 39.2, institutional: [], dividends: [{year: "2024", cash: 16.0}], epsHistory: [{year: "2024", val: 39.2}], news: [{title: "台積電營收創新高", date: "2026-11-16", url: "#"}] }
                    ]
                };
            }
            render();
        }

        function render() {
            document.getElementById('update-time-badge').innerText = `🕒 最後資料更新時間：${marketMetadata.lastUpdate}`;

            const container = document.getElementById('app-content');
            const navBack = document.getElementById('nav-back');
            const mainTabs = document.getElementById('main-tabs');

            if (currentView === 'favorite') {
                mainTabs.classList.remove('hidden');
                navBack.classList.add('hidden');
                document.getElementById('btn-fav').className = "bg-blue-600 text-white text-xl md:text-2xl font-bold py-4 px-4 rounded-2xl shadow-lg transition";
                document.getElementById('btn-sec').className = "bg-slate-200 text-slate-700 text-xl md:text-2xl font-bold py-4 px-4 rounded-2xl shadow-lg transition";
                
                renderStockList(getFavoriteStocksObject(), "⭐ 媽媽關注的最愛股票", container, true);
            } 
            else if (currentView === 'sectors') {
                mainTabs.classList.remove('hidden');
                navBack.classList.add('hidden');
                document.getElementById('btn-sec').className = "bg-blue-600 text-white text-xl md:text-2xl font-bold py-4 px-4 rounded-2xl shadow-lg transition";
                document.getElementById('btn-fav').className = "bg-slate-200 text-slate-700 text-xl md:text-2xl font-bold py-4 px-4 rounded-2xl shadow-lg transition";
                
                renderSectorsGrid(container);
            }
            else if (currentView === 'sector_detail') {
                mainTabs.classList.add('hidden');
                navBack.classList.remove('hidden');
                renderStockList(stockDatabase[selectedCategory] || [], `📂 ${selectedCategory} 類股清單`, container, false);
            }
            else if (currentView === 'stock_detail') {
                mainTabs.classList.add('hidden');
                navBack.classList.remove('hidden');
                renderStockDetail(window.currentStock, container);
            }
        }

        function switchTab(tab) {
            currentView = tab;
            render();
        }

        function getFavoriteStocksObject() {
            let favList = [];
            for (let cat in stockDatabase) {
                stockDatabase[cat].forEach(stock => {
                    if (favorites.includes(stock.code)) favList.push(stock);
                });
            }
            return favList;
        }

        function renderSectorsGrid(container) {
            const categories = Object.keys(stockDatabase).sort();
            let html = `<h2 class="text-2xl font-bold text-slate-700 mb-4">請選擇上市產業類別：</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            
            categories.forEach(cat => {
                html += `
                    <button onclick="openSector('${cat}')" class="text-left bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 p-6 rounded-2xl shadow transition flex justify-between items-center">
                        <span class="text-2xl font-bold text-blue-900">📊 ${cat}</span>
                        <span class="text-2xl text-blue-500 font-bold">➔</span>
                    </button>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function openSector(cat) {
            selectedCategory = cat;
            currentView = 'sector_detail';
            render();
        }

        function renderStockList(stocks, title, container, isFavView) {
            if (stocks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <h2 class="text-2xl font-bold text-slate-600 mb-2">${title}</h2>
                        <p class="text-slate-400 text-lg">目前沒有加入任何股票，快去類股總覽點選加入最愛吧！</p>
                    </div>
                `;
                return;
            }

            let html = `<h2 class="text-2xl font-bold text-slate-700 mb-4">${title}</h2>`;
            html += `<div class="space-y-3">`;

            stocks.forEach(stock => {
                const isFav = favorites.includes(stock.code);
                const colorClass = stock.change >= 0 ? "text-red-600" : "text-green-600";
                const sign = stock.change >= 0 ? "+" : "";

                html += `
                    <div class="bg-slate-50 border-2 border-slate-200 hover:border-blue-400 p-4 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition">
                        <div class="cursor-pointer flex-1" onclick="openStockDetail('${stock.code}')">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl font-extrabold text-blue-900">${stock.code} ${stock.name}</span>
                                <span class="text-xl font-bold ${colorClass}">$${stock.price}</span>
                            </div>
                            <div class="text-sm text-slate-500 mt-1 flex flex-wrap gap-3">
                                <span>漲跌: <strong class="${colorClass}">${sign}${stock.change} (${sign}${stock.changePct}%)</strong></span>
                                <span>成交量: <strong>${stock.volume} 張</strong></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            <button onclick="toggleFavorite('${stock.code}')" class="text-2xl px-4 py-2 bg-white border border-slate-300 rounded-xl shadow hover:bg-slate-100 transition">
                                ${isFav ? '⭐' : '☆'}
                            </button>
                            <button onclick="openStockDetail('${stock.code}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-xl shadow transition">
                                詳細資訊 ➔
                            </button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderStockDetail(stock, container) {
            const colorClass = stock.change >= 0 ? "text-red-600" : "text-green-600";
            const sign = stock.change >= 0 ? "+" : "";

            let html = `
                <div class="space-y-6">
                    <div class="bg-blue-50 border-2 border-blue-200 p-6 rounded-2xl shadow-inner">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center">
                            <div>
                                <span class="text-3xl md:text-4xl font-black text-blue-900">${stock.code} ${stock.name}</span>
                                <div class="text-3xl font-bold ${colorClass} mt-1">
                                    $${stock.price} <span class="text-xl">(${sign}${stock.change}, ${sign}${stock.changePct}%)</span>
                                </div>
                            </div>
                            <div class="mt-4 md:mt-0 text-slate-600 text-base space-y-1">
                                <div>📊 當日成交量：<strong>${stock.volume} 張</strong></div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white border-2 border-slate-200 p-4 rounded-2xl shadow-sm text-center">
                            <div class="text-slate-500 font-bold">本益比 (P/E)</div>
                            <div class="text-2xl font-extrabold text-blue-600 mt-1">${stock.pe} 倍</div>
                        </div>
                        <div class="bg-white border-2 border-slate-200 p-4 rounded-2xl shadow-sm text-center">
                            <div class="text-slate-500 font-bold">現金殖利率</div>
                            <div class="text-2xl font-extrabold text-emerald-600 mt-1">${stock.yieldPct}%</div>
                        </div>
                        <div class="bg-white border-2 border-slate-200 p-4 rounded-2xl shadow-sm text-center">
                            <div class="text-slate-500 font-bold">最新四季 EPS</div>
                            <div class="text-2xl font-extrabold text-purple-600 mt-1">$${stock.eps} 元</div>
                        </div>
                    </div>

                    <div class="bg-white border-2 border-slate-200 p-5 rounded-2xl shadow-sm">
                        <h3 class="text-xl font-bold text-slate-700 mb-3">🌍 三大法人近 5 日買賣超記錄</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b-2 border-slate-200 text-slate-500">
                                        <th class="py-2 px-3">日期</th>
                                        <th class="py-2 px-3">外資</th>
                                        <th class="py-2 px-3">投信</th>
                                        <th class="py-2 px-3">自營商</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            if (stock.institutional) {
                stock.institutional.forEach(row => {
                    html += `
                        <tr class="border-b border-slate-100">
                            <td class="py-2 px-3 font-semibold">${row.date}</td>
                            <td class="py-2 px-3">${row.foreign}</td>
                            <td class="py-2 px-3">${row.trust}</td>
                            <td class="py-2 px-3">${row.dealer}</td>
                        </tr>
                    `;
                });
            }

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white border-2 border-slate-200 p-5 rounded-2xl shadow-sm">
                            <h3 class="text-xl font-bold text-slate-700 mb-3">💰 歷年現金股利</h3>
                            <div class="space-y-2">
            `;

            if (stock.dividends) {
                stock.dividends.forEach(d => {
                    html += `<div class="flex justify-between py-1 border-b border-slate-100 text-lg">
                        <span class="font-bold">${d.year} 年</span>
                        <span class="text-emerald-600 font-bold">現金股利: ${d.cash} 元</span>
                    </div>`;
                });
            }

            html += `</div></div><div class="bg-white border-2 border-slate-200 p-5 rounded-2xl shadow-sm">
                            <h3 class="text-xl font-bold text-slate-700 mb-3">📈 歷年 EPS (每股盈餘)</h3>
                            <div class="space-y-2">`;

            if (stock.epsHistory) {
                stock.epsHistory.forEach(e => {
                    html += `<div class="flex justify-between py-1 border-b border-slate-100 text-lg">
                        <span class="font-bold">${e.year} 年</span>
                        <span class="text-blue-600 font-bold">${e.val} 元</span>
                    </div>`;
                });
            }

            html += `</div></div></div>`;

            html += `
                    <div class="bg-white border-2 border-slate-200 p-5 rounded-2xl shadow-sm">
                        <h3 class="text-xl font-bold text-slate-700 mb-3">📰 個股近期重點新聞</h3>
                        <div class="space-y-3">
            `;

            if (stock.news) {
                stock.news.forEach(n => {
                    html += `
                        <a href="${n.url}" target="_blank" class="block p-3 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl transition">
                            <div class="text-blue-700 font-bold text-lg hover:underline">${n.title}</div>
                            <div class="text-xs text-slate-400 mt-1">${n.date}</div>
                        </a>
                    `;
                });
            }

            html += `</div></div></div>`;
            container.innerHTML = html;
        }

        function openStockDetail(code) {
            let found = null;
            for (let cat in stockDatabase) {
                let match = stockDatabase[cat].find(s => s.code === code);
                if (match) { found = match; break; }
            }
            if (found) {
                window.currentStock = found;
                currentView = 'stock_detail';
                render();
            }
        }

        function toggleFavorite(code) {
            if (favorites.includes(code)) {
                favorites = favorites.filter(c => c !== code);
            } else {
                favorites.push(code);
            }
            localStorage.setItem('mom_stock_fav', JSON.stringify(favorites));
            render();
        }

        function goBack() {
            if (currentView === 'stock_detail') {
                currentView = selectedCategory ? 'sector_detail' : 'favorite';
            } else if (currentView === 'sector_detail') {
                currentView = 'sectors';
            }
            render();
        }

        initApp();
    </script>
</body>
</html>
