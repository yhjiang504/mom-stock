name: 每日下午 5 點自動更新台股資料與財報

on:
  schedule:
    # 台灣時間週一至週五下午 5:00 (UTC 09:00) 自動執行
    - cron: '0 9 * * 1-5'
    
  workflow_dispatch: # 允許手動點按鈕立即執行

# 【關鍵修正】授權 GitHub Actions 擁有寫入與推送權限
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 讀取專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝需要的工具套件
        run: |
          pip install requests

      - name: 4. 執行 Python 抓取最新台股與財報資料
        run: |
          python update_stock.py

      - name: 5. 自動將更新後的檔案推送到 GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stock_data.json
          git commit -m "📊 系統自動更新台股盤後與財報資料 ($(date +'%Y-%m-%d %H:%M'))" || exit 0
          git push
