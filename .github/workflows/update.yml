name: 每日自動更新台股資料

on:
  schedule:
    # 台灣時間每個交易日（週一至週五）下午 3 點 30 分執行 (UTC 7:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 讀取專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝需要的工具套件
        run: |
          pip install requests pandas yfinance

      - name: 4. 執行 Python 抓取最新台股資料
        run: |
          python update_stock.py

      - name: 5. 自動將更新後的檔案推送到 GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stock_data.json
          git commit -m "📊 系統自動更新台股盤後資料 ($(date +'%Y-%m-%d %H:%M'))" || exit 0
          git push
